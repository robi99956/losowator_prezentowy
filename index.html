:root{
  --bg:#EEF0F5; --surface:#F9FAFC; --ink:#1D2340; --muted:#59607A; --line:#C9CEDC;
  --accent:#5B3FD6; --accent-ink:#FFFFFF; --gold:#A87600; --stripe:rgba(91,63,214,.2);
  --slip:#FFFFFF; --slip-ink:#1D2340;
  --display:"Young Serif Embedded", Georgia, "Times New Roman", serif;
  --body:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12152A; --surface:#1B1F3A; --ink:#E8EAF4; --muted:#A2A8C3; --line:#2E3456;
    --accent:#A493FF; --accent-ink:#12152A; --gold:#F0C24B; --stripe:rgba(164,147,255,.25);
    --slip:#F4F3FA; --slip-ink:#1D2340;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:40px 20px 64px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,11vw,68px);line-height:1;margin:0 0 14px;letter-spacing:-.01em;overflow-wrap:anywhere}
h2{font-size:20px;font-weight:700;margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 28px;max-width:44ch}
section{margin-bottom:32px}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:999px;padding:16px 28px;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
.btn.quiet{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-size:15px;padding:9px 16px;width:auto;font-weight:600}
.btn.quiet:hover{border-color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0}
.err{color:var(--accent);font-weight:600}
label{display:block;font-weight:600;font-size:15px;margin:16px 0 6px}
label small{font-weight:400;color:var(--muted)}
textarea,input[type=text],select{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:200px;resize:vertical}
.actions{margin-top:20px}
.meta{color:var(--muted);margin:0 0 16px}
.links{list-style:none;padding:0;margin:0 0 16px;border-top:1px solid var(--line)}
.links li{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.links .who{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links .who small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.links li.sent .who small{color:var(--accent)}
.warn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px;color:var(--muted);margin-bottom:18px}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;padding:4px 0}
.tagwrap{position:relative;padding:10px 0 4px;margin-bottom:22px}
.tag{position:relative;background:var(--slip);color:var(--slip-ink);padding:26px 28px 26px 64px;
  clip-path:polygon(36px 0,100% 0,100% 100%,36px 100%,0 50%);filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
.tag::before{content:"";position:absolute;left:22px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.tag .for,.tag .from{font-size:15px;margin:0 0 6px;opacity:.72}
.tag .from{margin:10px 0 0;font-size:14px}
.reel{height:64px;overflow:hidden;border-radius:6px}
.reel.closed{background:repeating-linear-gradient(-45deg,var(--stripe) 0 10px,transparent 10px 20px)}
.reel.closed .strip{visibility:hidden}
.strip{will-change:transform}
.strip div{height:64px;line-height:64px;font-family:var(--display);font-size:clamp(32px,9vw,46px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{color:var(--muted);margin:-12px 0 24px}
.stamp{font-size:14px;color:var(--muted);margin:22px 0 0;padding-top:14px;border-top:1px solid var(--line)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.strip{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title" data-i18n="title">Losowanie prezentów</h1>

  <div id="organizer" hidden>
    <p class="lede" data-i18n="orgLede"></p>
    <section id="setup">
      <label for="lang" data-i18n="langLabel"></label>
      <select id="lang">
        <option value="pl">Polski</option>
        <option value="en">English</option>
      </select>
      <label for="occasion"><span data-i18n="occLabel"></span> <small data-i18n="occHint"></small></label>
      <input type="text" id="occasion" maxlength="80" data-i18n-ph="occPh">
      <label for="people"><span data-i18n="peopleLabel"></span> <small data-i18n="peopleHint"></small></label>
      <textarea id="people" data-i18n-ph="peoplePh"></textarea>
      <label for="note"><span data-i18n="noteLabel"></span> <small data-i18n="noteHint"></small></label>
      <input type="text" id="note" maxlength="200" data-i18n-ph="notePh">
      <label for="base"><span data-i18n="baseLabel"></span> <small data-i18n="baseHint"></small></label>
      <input type="text" id="base" placeholder="https://your-username.github.io/gift-draw/">
      <div class="actions"><button class="btn" id="make" data-i18n="make"></button></div>
      <p class="err" id="err" hidden></p>
    </section>
    <section id="out" hidden>
      <h2 data-i18n="sendTitle"></h2>
      <p class="meta" id="meta"></p>
      <div class="warn" data-i18n="warn"></div>
      <ul class="links" id="links"></ul>
      <button class="linkbtn" id="redo" data-i18n="redo"></button>
    </section>
  </div>

  <div id="person" hidden>
    <p class="lede" id="hello"></p>
    <p class="note" id="pnote" hidden></p>
    <div class="tagwrap">
      <div class="tag">
        <p class="for" data-i18n="forLine"></p>
        <div class="reel closed" id="reel"><div class="strip" id="strip"></div></div>
        <p class="from" id="from"></p>
      </div>
    </div>
    <button class="btn" id="drawBtn" data-i18n="drawBtn"></button>
    <p class="hint" id="after" hidden data-i18n="after"></p>
    <p class="stamp" id="stamp" hidden></p>
  </div>

  <div id="bad" hidden>
    <p class="lede" data-i18n="bad"></p>
  </div>
</div>

<script>
(function(){
  const T={
    pl:{
      title:"Losowanie prezentów",
      orgLede:"Zrób losowanie tutaj, a potem wyślij każdej osobie jej prywatny link. Nikt nie potrzebuje konta, a Ty nie zobaczysz, kto kogo wylosował.",
      langLabel:"Język strony i linków",
      occLabel:"Okazja", occHint:"(opcjonalnie)", occPh:"Urodziny Ani albo wymiana prezentów w biurze",
      peopleLabel:"Uczestnicy", peopleHint:"(jedno imię w linii, co najmniej 3)", peoplePh:"Anna\nTomek\nKasia\nPiotr",
      noteLabel:"Wiadomość dla wszystkich", noteHint:"(opcjonalnie, np. budżet i data)", notePh:"Budżet 100 zł, wymiana prezentów w piątek",
      baseLabel:"Adres strony", baseHint:"(gdzie ta strona jest opublikowana)",
      make:"Zrób losowanie",
      errPeople:"Dodaj co najmniej 3 różne imiona.",
      errBase:"Podaj adres, pod którym jest ta strona, zaczynający się od https://",
      sendTitle:"Wyślij te linki",
      metaDate:"Losowanie z {date}",
      metaBoth:"{occ}, losowanie z {date}",
      warn:"Wyślij każdej osobie tylko jej własny link i nie otwieraj cudzych linków, bo zobaczysz, kogo wylosowali. Twój własny link też jest na liście.",
      notSent:"Jeszcze nie wysłano", sent:"Link skopiowany",
      share:"Udostępnij", copy:"Kopiuj link", copied:"Skopiowano",
      shareText:"Cześć, {name}! Oto Twój link do losowania prezentów:",
      shareTextOcc:"Cześć, {name}! Oto Twój link do losowania ({occ}):",
      redo:"Zacznij od nowa z nowym losowaniem",
      redoArmed:"Kliknij jeszcze raz, żeby wyrzucić te linki i losować od nowa",
      hello:"Cześć, {name}! Kliknij przycisk, żeby sprawdzić, komu kupujesz prezent.",
      forLine:"Kupujesz prezent dla:",
      from:"Od: {name}",
      drawBtn:"Losuj moją osobę",
      after:"Zachowaj to dla siebie. Ten link zawsze pokazuje tę samą osobę, więc możesz go otworzyć w każdej chwili.",
      stamp:"Losowanie z {date}. Jeśli dostaniesz nowszy link, ważny jest ten nowszy.",
      docTitle:"{title}: {name}",
      bad:"Ten link wygląda na niekompletny. Poproś organizatora o ponowne wysłanie i skopiuj go w całości."
    },
    en:{
      title:"Gift exchange draw",
      orgLede:"Make the draw here, then send each person their own private link. Nobody needs an account, and you won’t see who anyone got.",
      langLabel:"Language of the page and links",
      occLabel:"Occasion", occHint:"(optional)", occPh:"Anna’s birthday or the office gift swap",
      peopleLabel:"Participants", peopleHint:"(one name per line, at least 3)", peoplePh:"Anna\nTom\nKate\nPeter",
      noteLabel:"Note for everyone", noteHint:"(optional, e.g. budget and date)", notePh:"Budget £20, gifts exchanged on Friday",
      baseLabel:"Page address", baseHint:"(where this page is hosted)",
      make:"Make the draw",
      errPeople:"Add at least 3 different names.",
      errBase:"Add the web address where this page is hosted, starting with https://",
      sendTitle:"Send these links",
      metaDate:"Draw made on {date}",
      metaBoth:"{occ}, draw made on {date}",
      warn:"Send each person only their own link, and don’t open other people’s links yourself, or you’ll see who they drew. Your own link is in the list too.",
      notSent:"Not sent yet", sent:"Link copied",
      share:"Share", copy:"Copy link", copied:"Copied",
      shareText:"Hi {name}! Here’s your link for the gift exchange draw:",
      shareTextOcc:"Hi {name}! Here’s your gift draw for {occ}:",
      redo:"Start over with a new draw",
      redoArmed:"Click again to throw away these links and draw again",
      hello:"Hi {name}! Tap the button to find out who you’re buying a gift for.",
      forLine:"You’re buying a gift for",
      from:"From {name}",
      drawBtn:"Draw my person",
      after:"Keep it to yourself. This link always shows the same person, so you can open it again any time.",
      stamp:"Draw made on {date}. If you get a newer link, the newer one counts.",
      docTitle:"{title} for {name}",
      bad:"This link looks incomplete. Ask the organizer to send it again, and make sure you copy the whole thing."
    }
  };
  let L = /^pl\b/i.test(navigator.language||"") ? "pl" : "en";
  const $=id=>document.getElementById(id);
  function t(k,vars){ let s=(T[L]&&T[L][k])||T.en[k]||""; if(vars) for(const v in vars) s=s.split("{"+v+"}").join(vars[v]); return s; }
  function fmtDate(ms){ try{ return new Intl.DateTimeFormat(L==="pl"?"pl-PL":"en-GB",{dateStyle:"long",timeStyle:"short"}).format(new Date(ms)); }catch(e){ return new Date(ms).toLocaleString(); } }
  function applyLang(){
    document.documentElement.lang=L;
    document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.placeholder=t(el.dataset.i18nPh); });
    if(!location.hash) document.title=t("title");
  }

  const enc=new TextEncoder(), dec=new TextDecoder();
  function rand(n){ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; }
  function b64u(bytes){ let s=""; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  function unb64u(str){ str=str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str+="="; const s=atob(str); return Uint8Array.from(s,c=>c.charCodeAt(0)); }
  // Scrambled so the result can't be read from the link at a glance.
  function seal(obj){
    const data=enc.encode(JSON.stringify(obj)), key=new Uint8Array(8); crypto.getRandomValues(key);
    const out=new Uint8Array(8+data.length); out.set(key);
    data.forEach((b,i)=>{ out[8+i]=b^key[i%8]^((i*31)&255); });
    return b64u(out);
  }
  function unseal(str){
    const all=unb64u(str), key=all.slice(0,8), data=all.slice(8).map((b,i)=>b^key[i%8]^((i*31)&255));
    return JSON.parse(dec.decode(data));
  }
  // Readable version stamp at the front of each link, e.g. v20261107-1432
  function stamp(ms){ const d=new Date(ms), p=n=>String(n).padStart(2,"0");
    return "v"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes()); }
  function store(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){} }
  function load(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }

  let current=null;
  const hash=location.hash.slice(1);
  if(hash) participant(hash); else organizer();

  // ---------------- participant ----------------
  function participant(h){
    let d;
    try{
      const code=h.includes(".") ? h.slice(h.lastIndexOf(".")+1) : h;
      d=unseal(code);
      if(!Array.isArray(d.p)||d.p[d.i]==null||d.p[d.t]==null||d.i===d.t) throw 0;
    }catch(e){ applyLang(); $("bad").hidden=false; return; }
    if(d.l && T[d.l]) L=d.l;
    applyLang();
    const name=d.p[d.i];
    if(d.o) $("title").textContent=d.o;
    document.title=t("docTitle",{title:d.o||t("title"),name});
    $("person").hidden=false;
    $("hello").textContent=t("hello",{name});
    if(d.n){ $("pnote").hidden=false; $("pnote").textContent=d.n; }
    $("from").textContent=t("from",{name});
    if(d.v){ $("stamp").hidden=false; $("stamp").textContent=t("stamp",{date:fmtDate(d.v)}); }
    $("drawBtn").addEventListener("click",()=>{
      $("drawBtn").hidden=true;
      const reel=$("reel"), strip=$("strip");
      reel.classList.remove("closed");
      strip.textContent="";
      const others=d.p.map((_,k)=>k).filter(k=>k!==d.i);
      const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
      const seq=[];
      if(!reduced) for(let k=0;k<26;k++) seq.push(others[rand(others.length)]);
      seq.push(d.t);
      seq.forEach(k=>{ const el=document.createElement("div"); el.textContent=d.p[k]; strip.appendChild(el); });
      strip.style.transform="translateY(0)";
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        strip.style.transition="transform 3.2s cubic-bezier(.12,.8,.18,1)";
        strip.style.transform=`translateY(-${(seq.length-1)*64}px)`;
      }));
      setTimeout(()=>{ $("after").hidden=false; }, reduced?0:3300);
    });
  }

  // ---------------- organizer ----------------
  function organizer(){
    $("organizer").hidden=false;
    if(/^https?:$/.test(location.protocol)) $("base").value=location.href.split("#")[0];
    const saved=load("ss-draw");
    if(saved){ try{ current=JSON.parse(saved); if(current.lang && T[current.lang]) L=current.lang; }catch(e){ current=null; store("ss-draw",null); } }
    $("lang").value=L;
    applyLang();
    if(current) showLinks(current);

    $("lang").addEventListener("change",e=>{ L=e.target.value; applyLang(); });

    $("make").addEventListener("click",()=>{
      const err=$("err"); err.hidden=true;
      const seen=new Set();
      const people=$("people").value.split(/\n|,/).map(s=>s.trim()).filter(s=>{ const k=s.toLowerCase(); if(!s||seen.has(k)) return false; seen.add(k); return true; });
      const base=$("base").value.trim();
      if(people.length<3){ err.textContent=t("errPeople"); err.hidden=false; return; }
      if(!/^https?:\/\//.test(base)){ err.textContent=t("errBase"); err.hidden=false; return; }
      const n=people.length, perm=[...Array(n).keys()];
      // Sattolo's algorithm: one random loop, so nobody ever draws themselves.
      for(let i=n-1;i>0;i--){ const j=rand(i); [perm[i],perm[j]]=[perm[j],perm[i]]; }
      const note=$("note").value.trim(), occ=$("occasion").value.trim(), v=Date.now();
      current={ base:base.split("#")[0], lang:L, occasion:occ, v, stamp:stamp(v),
        links: people.map((name,i)=>({ name, code: seal({p:people,i,t:perm[i],n:note,o:occ,v,l:L}), sent:false })) };
      store("ss-draw",JSON.stringify(current));
      showLinks(current);
    });

    $("redo").addEventListener("click",()=>{
      const r=$("redo");
      if(r.dataset.armed){
        store("ss-draw",null); current=null; $("out").hidden=true; $("setup").hidden=false;
        delete r.dataset.armed; r.textContent=t("redo"); return;
      }
      r.dataset.armed="1"; r.textContent=t("redoArmed");
      setTimeout(()=>{ delete r.dataset.armed; r.textContent=t("redo"); },4000);
    });
  }

  function showLinks(draw){
    $("setup").hidden=true; $("out").hidden=false;
    const date=draw.v?fmtDate(draw.v):"";
    $("meta").hidden=!date;
    $("meta").textContent = draw.occasion ? t("metaBoth",{occ:draw.occasion,date}) : t("metaDate",{date});
    const ul=$("links"); ul.textContent="";
    draw.links.forEach(l=>{
      const url=draw.base+"#"+(draw.stamp?draw.stamp+".":"")+l.code;
      const li=document.createElement("li"); if(l.sent) li.className="sent";
      const who=document.createElement("div"); who.className="who"; who.textContent=l.name;
      const st=document.createElement("small"); st.textContent=l.sent?t("sent"):t("notSent"); who.appendChild(st);
      const mark=()=>{ l.sent=true; li.className="sent"; st.textContent=t("sent"); store("ss-draw",JSON.stringify(draw)); };
      li.appendChild(who);
      if(navigator.share){
        const sb=document.createElement("button"); sb.className="btn quiet"; sb.textContent=t("share");
        sb.addEventListener("click",async()=>{
          const text=draw.occasion?t("shareTextOcc",{name:l.name,occ:draw.occasion}):t("shareText",{name:l.name});
          try{ await navigator.share({title:draw.occasion||t("title"), text, url}); mark(); }catch(e){}
        });
        li.appendChild(sb);
      }
      const cb=document.createElement("button"); cb.className="btn quiet"; cb.textContent=t("copy");
      cb.addEventListener("click",async()=>{
        try{ await navigator.clipboard.writeText(url); }
        catch(e){ const ta=document.createElement("textarea"); ta.value=url; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove(); }
        cb.textContent=t("copied"); setTimeout(()=>{ cb.textContent=t("copy"); },1500); mark();
      });
      li.appendChild(cb);
      ul.appendChild(li);
    });
  }
})();
</script>
</body>
</html>
